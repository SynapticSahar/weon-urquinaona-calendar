name: Update timetable and deploy site

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC. This maps to 06:00, 10:00, and 13:00-19:00 in Europe/Madrid during summer time.
    - cron: "0 4,8,11-17 * * *"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scrape_schedule.py"
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: python scrape_schedule.py
      - name: Commit refreshed timetable
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/schedule.json
          git diff --cached --quiet || git commit -m "Update We/On timetable"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ github.token }}
